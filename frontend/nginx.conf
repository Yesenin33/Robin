# Docker's embedded DNS. Without it nginx resolves `api` ONCE at start and caches the IP, so every
# `docker compose up -d --build api` (new container = new IP) leaves nginx proxying to a dead
# address and the whole public /api returns 502 until `web` is restarted. The `resolve` flag makes
# nginx re-resolve the name at request time.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_upstream {
    zone api_upstream 64k;
    server api:8000 resolve;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  # API: same origin, no CORS
  location /api/ {
    proxy_pass http://api_upstream/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
  }

  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
