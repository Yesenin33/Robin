name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest (hermetic — RPC, explorer, market, Telegram and Web Push are mocked)
        run: pytest -q

  browser:
    # the Chromium sidecar against a fake Cloudflare-challenged explorer (real browser, no network needed)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: browser/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          PYTHONPATH: .
        run: pytest -q
      - name: the image builds
        run: docker build -t chainfolio-browser .

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chainfolio
          POSTGRES_PASSWORD: chainfolio
          POSTGRES_DB: chainfolio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chainfolio" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://chainfolio:chainfolio@localhost:5432/chainfolio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt
      - name: upgrade -> downgrade one step -> upgrade
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
