<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>body{margin:0;background:#F7F5EF;font-family:'Albert Sans',system-ui,sans-serif;color:#110E08}a{color:#110E08}*{box-sizing:border-box}@keyframes cfspin{to{transform:rotate(360deg)}}</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;padding:28px 20px;background:radial-gradient(ellipse 90% 34% at 50% -6%,rgba(204,255,0,.2),rgba(204,255,0,0) 100%),#F7F5EF">
  <a href="Landing.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;align-self:center"><svg width="32" height="32" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="#110E08"></rect><path d="M22 10.5A8.5 8.5 0 1 0 22 21.5" fill="none" stroke="#CCFF00" stroke-width="3" stroke-linecap="round"></path><path d="M14 19l4-4 2 2 5-5.5" fill="none" stroke="#F7F5EF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg><span style="font-family:'Newsreader',serif;font-size:24px;letter-spacing:-.02em">Chainfolio</span></a>
  <div style="margin:auto;width:100%;max-width:440px;display:flex;flex-direction:column;gap:24px;padding:32px 0">
    <div style="display:flex;flex-direction:column;gap:12px;text-align:center"><div style="font-family:'Newsreader',serif;font-size:42px;line-height:1.05;letter-spacing:-.03em">Connect a wallet to continue</div><div style="color:#4A463D;font-size:16px;line-height:1.5">Your wallet is your Chainfolio account. It shows your portfolio and keeps your alerts.</div></div>
    <sc-if value="{{ isError }}" hint-placeholder-val="{{ false }}"><div style="background:#FCE6E2;color:#8F1D15;border-radius:16px;padding:16px;font-size:15px;line-height:1.45">Couldn't connect your wallet. Try again in a moment.</div></sc-if>
    <sc-if value="{{ isLoading }}" hint-placeholder-val="{{ false }}"><div style="height:56px;border-radius:99px;background:#D9D5C9;color:#5E594E;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:12px"><span style="width:18px;height:18px;border-radius:50%;border:2.5px solid #B9B3A6;border-top-color:#110E08;animation:cfspin 1s linear infinite"></span>Waiting for your wallet…</div></sc-if>
    <sc-if value="{{ notLoading }}" hint-placeholder-val="{{ true }}"><a href="Portfolio.dc.html" style="height:56px;border-radius:99px;background:#110E08;color:#F7F5EF;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;text-decoration:none">Connect wallet</a></sc-if>
    <div style="display:flex;flex-direction:column;gap:14px;align-items:center;margin-top:8px"><div style="display:flex;gap:10px;color:#5E594E;font-size:14px;line-height:1.5"><span>Only you can move your money. We can never touch it.</span></div><a href="Landing.dc.html" style="font-size:14px;font-weight:600;color:#5E594E;text-decoration:none;padding:8px">Sign out</a></div>
  </div>
  <dc-import name="ProtoDock" page="Connect" hint-size="0px,0px"></dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() { const st = new URLSearchParams(window.location.search).get('state') || 'ready'; return { isError: st === 'error', isLoading: st === 'loading', notLoading: st !== 'loading' }; }
}

</script>
</body>
</html>
